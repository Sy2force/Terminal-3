<svg width="400" height="96" viewBox="0 0 400 96" xmlns="http://www.w3.org/2000/svg" aria-label="Terminal 3 — Cave & Épicerie Fine" role="img">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D58A"/>
      <stop offset="50%" stop-color="#D5B05F"/>
      <stop offset="100%" stop-color="#9E7434"/>
    </linearGradient>
    <linearGradient id="gold-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E3B0"/>
      <stop offset="100%" stop-color="#D5B05F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Stylized T with corkscrew -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle of the T / corkscrew -->
    <line x1="6" y1="12" x2="54" y2="12" stroke-width="3"/>
    <!-- Vertical stem with spring / worm -->
    <path d="M30,14 L30,20" />
    <path d="M30,20 C38,22 38,28 30,30 C22,32 22,38 30,40 C38,42 38,48 30,50 C22,52 22,58 30,60 C38,62 38,68 30,70" fill="none" />
    <!-- Tip of the worm -->
    <path d="M30,70 C32,72 32,74 30,76" stroke-width="1.8" />
  </g>

  <!-- Main wordmark -->
  <text x="70" y="52" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="0.5" fill="url(#gold)" style="font-variant-ligatures: discretionary-ligatures;">
    TERMINAL <tspan font-style="italic" font-weight="500" fill="url(#gold-3)">3</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="78" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="3.5" fill="#C6A15B" style="text-transform: uppercase;">
    Cave &amp; Épicerie Fine
  </text>
</svg>
